<svg fill="none" viewBox="0 0 342 175" height="175" width="342" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" y2="128" x2="342" y1="128" x1="0" id="bgWhite">
      <stop stop-color="#ffffff" stop-opacity="0.97"></stop>
      <stop stop-color="#f1fff3" stop-opacity="0.94" offset="1"></stop>
    </linearGradient>
    <radialGradient id="splash1" cx="50%" cy="50%" r="50%">
      <stop stop-color="#25cc5d" stop-opacity="0.32"></stop>
      <stop stop-color="#25cc5d" stop-opacity="0" offset="1"></stop>
    </radialGradient>
    <radialGradient id="splash2" cx="50%" cy="50%" r="50%">
      <stop stop-color="#8ae99b" stop-opacity="0.3"></stop>
      <stop stop-color="#8ae99b" stop-opacity="0" offset="1"></stop>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0e923f" flood-opacity="0.18"></feDropShadow>
    </filter>
    <!-- 轻度羽化，仅柔化边缘、不再大幅晕开 -->
    <filter id="soften" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"></feGaussianBlur>
    </filter>
  </defs>

  <!-- 白色主底（占据绝大部分面积、几乎实白） -->
  <path fill="url(#bgWhite)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2" filter="url(#cardShadow)" d="M0 80C0 45 0 30 11 22C22 -3 40 1 73 8L307 28C324 31 332 34 337 41C342 48 342 56 342 71V121C342 141 342 151 335 157C329 163 318 163 298 163H44C23 163 12 163 6 157C0 151 0 141 0 121V80Z"></path>

  <!-- 绿色泼洒：少量、小范围、仅作角落点缀 -->
  <g filter="url(#soften)" opacity="0.85">
    <circle cx="312" cy="150" r="34" fill="url(#splash1)"></circle>
    <circle cx="30" cy="150" r="28" fill="url(#splash2)"></circle>
    <circle cx="320" cy="20" r="22" fill="url(#splash2)"></circle>
  </g>
</svg>

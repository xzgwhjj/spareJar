<svg fill="none" viewBox="0 0 342 130" height="130" width="342" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" y2="128" x2="342" y1="128" x1="0" id="bgWhite">
      <stop stop-color="#ffffff" stop-opacity="0.97"></stop>
      <stop stop-color="#f1fff3" stop-opacity="0.94" offset="1"></stop>
    </linearGradient>
    <radialGradient id="splash1" cx="50%" cy="50%" r="50%">
      <stop stop-color="#25cc5d" stop-opacity="0.32"></stop>
      <stop stop-color="#25cc5d" stop-opacity="0" offset="1"></stop>
    </radialGradient>
    <radialGradient id="splash2" cx="50%" cy="50%" r="50%">
      <stop stop-color="#8ae99b" stop-opacity="0.3"></stop>
      <stop stop-color="#8ae99b" stop-opacity="0" offset="1"></stop>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#0e923f" flood-opacity="0.16"></feDropShadow>
    </filter>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"></feGaussianBlur>
    </filter>
  </defs>

  <!-- 白色主底：左上斜角造型，左/右/底贴满画布（仅留圆角），四边均有边框+阴影 -->
  <path fill="url(#bgWhite)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="2" filter="url(#cardShadow)" d="M0 130V36C0 28 5 22 13 20L300 42C320 45 332 48 337 55C342 62 342 70 342 78V122C342 126 338 130 333 130H9C4 130 0 126 0 121V130Z"></path>

  <!-- 绿色泼洒：少量、小范围、仅作角落点缀 -->
  <g filter="url(#soften)" opacity="0.85">
    <circle cx="312" cy="118" r="30" fill="url(#splash1)"></circle>
    <circle cx="30" cy="118" r="24" fill="url(#splash2)"></circle>
    <circle cx="320" cy="14" r="18" fill="url(#splash2)"></circle>
  </g>
</svg>
